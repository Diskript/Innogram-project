name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clean build caches
        run: rm -f packages/shared-types/tsconfig.tsbuildinfo packages/database/tsconfig.tsbuildinfo

      - name: Build shared-types
        run: pnpm --filter @repo/shared-types build

      - name: Build database
        run: pnpm --filter @repo/database build

      - name: Run type check
        run: pnpm check-types

  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    container:
      image: node:20-alpine
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: innogram_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
      rabbitmq:
        image: rabbitmq:3-management
        ports: ["5672:5672"]
    env:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/innogram_test
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
    steps:
      - name: Install system dependencies
        run: apk add --no-cache libc6-compat openssl git bash

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clean build caches
        run: rm -f packages/shared-types/tsconfig.tsbuildinfo packages/database/tsconfig.tsbuildinfo

      - name: Build shared-types
        run: pnpm --filter @repo/shared-types build

      - name: Build database
        run: pnpm --filter @repo/database build

      - name: Apply database migrations
        run: pnpm --filter @repo/database exec prisma migrate deploy

      - name: Run unit tests with coverage
        run: pnpm -r --if-present test:cov

      - name: Run core integration (e2e) tests
        run: pnpm --filter @repo/api-core test:e2e

      - name: Run auth integration (e2e) tests
        run: pnpm --filter @repo/api-auth test:e2e

      - name: Upload core coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-core
          path: apps/api/apps/core-microservice/coverage/

      - name: Upload auth coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-auth
          path: apps/api/apps/auth-microservice/coverage/

      - name: Upload web coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-web
          path: apps/web/coverage/

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Clean build caches
        run: rm -f packages/shared-types/tsconfig.tsbuildinfo packages/database/tsconfig.tsbuildinfo

      - name: Build shared-types
        run: pnpm --filter @repo/shared-types build

      - name: Build database
        run: pnpm --filter @repo/database build

      - name: Build remaining packages
        run: pnpm --filter "@repo/api-*" build
