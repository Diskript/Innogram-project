services:
  postgres:
    image: postgres:15
    container_name: innogram-postgres
    environment:
      POSTGRES_DB: innogram
      POSTGRES_USER: innogram_user
      POSTGRES_PASSWORD: innogram_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U innogram_user -d innogram"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - innogram-network

  redis:
    image: redis:7-alpine
    container_name: innogram-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - innogram-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: innogram-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: innogram
      RABBITMQ_DEFAULT_PASS: innogram_password
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - innogram-network

  # Nginx reverse proxy - routes requests to appropriate microservices
  nginx:
    image: nginx:alpine
    container_name: innogram-nginx
    ports:
      - "3000:3000"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      core-microservice:
        condition: service_started
      auth-microservice:
        condition: service_started
    networks:
      - innogram-network
    restart: unless-stopped

  # Auth microservice - handles authentication (JWT, Google OAuth)
  auth-microservice:
    build:
      context: .
      dockerfile: apps/api/apps/auth-microservice/Dockerfile
    container_name: innogram-auth
    environment:
      DATABASE_URL: postgresql://innogram_user:innogram_password@postgres:5432/innogram
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-here}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      HASH_SALT: ${HASH_SALT}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      AUTH_SERVICE_URL: http://auth-microservice:3002
      CORE_SERVICE_URL: http://core-microservice:3001
      WEB_SERVICE_URL: http://web:3003
    ports:
      - "3002:3002"
    depends_on:
      migration:
        condition: service_completed_successfully
    networks:
      - innogram-network
    restart: unless-stopped

  # Core microservice - API Gateway, handles business logic
  core-microservice:
    build:
      context: .
      dockerfile: apps/api/apps/core-microservice/Dockerfile
    container_name: innogram-core
    environment:
      DATABASE_URL: postgresql://innogram_user:innogram_password@postgres:5432/innogram
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://innogram:innogram_password@rabbitmq:5672
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-here}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      HASH_SALT: ${HASH_SALT}
      AUTH_SERVICE_URL: http://auth-microservice:3002
      CORE_SERVICE_URL: http://core-microservice:3001
      WEB_SERVICE_URL: http://web:3003
    ports:
      - "3001:3001"
    depends_on:
      migration:
        condition: service_completed_successfully
    networks:
      - innogram-network
    restart: unless-stopped

  # Migration service - runs database migrations
  migration:
    build:
      context: .
      dockerfile: apps/api/apps/auth-microservice/Dockerfile
    container_name: innogram-migration
    environment:
      - DATABASE_URL=postgresql://innogram_user:innogram_password@postgres:5432/innogram
    command:
      [
        "npx",
        "prisma",
        "db",
        "push",
        "--schema=./packages/database/prisma/schema.prisma",
        "--url",
        "postgresql://innogram_user:innogram_password@postgres:5432/innogram",
        "--accept-data-loss",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - innogram-network
    restart: "no"

  # Web - Next.js frontend
