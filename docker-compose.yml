#      dockerfile: apps/web/Dockerfile
#    container_name: innogram-web
#    environment:
#      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
#      NEXT_PUBLIC_AUTH_URL: ${NEXT_PUBLIC_AUTH_URL:-http://localhost:3000}
#    ports:
