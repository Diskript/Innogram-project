events {
    worker_connections 1024;
}

http {
    # Upstream backend services
    upstream core_service {
        server core-microservice:3001;
    }

    upstream auth_service {
        server auth-microservice:3002;
    }

    # Main server - routes requests to appropriate microservice
    server {
        listen 3000;
        server_name localhost;

        # CORS is handled by the microservices themselves (NestJS app.enableCors).
        # Adding CORS headers here would duplicate Access-Control-Allow-Origin
        # and break browsers.

        # Auth microservice routes
        location /auth/ {
            proxy_pass http://auth_service/auth/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Also route /jwt-auth/ to auth service (for auth microservice endpoints)
        location /jwt-auth/ {
            proxy_pass http://auth_service/jwt-auth/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Socket.IO engine + namespaces (the client connects to /socket.io/
        # for the engine handshake, then joins the /ws namespace via CONNECT)
        location /socket.io/ {
            proxy_pass http://core_service/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # WebSocket endpoint (Socket.IO legacy/clients that target /ws)
        location /ws {
            proxy_pass http://core_service/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # Core microservice routes (API Gateway)
        location / {
            proxy_pass http://core_service/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}